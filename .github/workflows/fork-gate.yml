name: fork-gate

# Lint and tests for the code this fork owns: the challenge app and use_case/.
# Upstream's mirrors.yml runs a subset of `make check` plus notebook execution,
# but never these suites.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref makes the older run moot.
concurrency:
  group: fork-gate-${{ github.ref }}
  cancel-in-progress: true

# The job runs PR-controlled code; it only needs to read the repo.
permissions:
  contents: read

jobs:
  fork-tests:
    runs-on: ubuntu-latest
    # The suites finish in seconds; a hang (e.g. an unstubbed model call) shouldn't hold a runner for 6 hours.
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit: a tag can be moved to different code, a SHA cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # no step needs git auth; keep the token out of .git/config
      # Same release as mirrors.yml, by commit.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Version and rules pinned inline (--isolated ignores config files), so a
      # ruff release can't change what passes and upstream's pyproject stays untouched.
      - name: Ruff on owned code
        run: uvx ruff@0.14.13 check --isolated --target-version py312 --select E4,E7,E9,F 01_Product_Engineering/challenge use_case

      # Tests still run when lint fails, so one run reports everything.
      - name: Challenge tests
        if: ${{ !cancelled() }}
        working-directory: 01_Product_Engineering/challenge
        run: uv run --frozen python -m unittest discover -q

      # The documented invocation (see use_case/evals/test_*.py): the challenge's environment,
      # because the eval harness imports challenge modules.
      - name: use_case eval tests
        if: ${{ !cancelled() }}
        run: uv run --frozen --project 01_Product_Engineering/challenge python -m unittest discover -q -s use_case/evals

      # tc6 is not a package, so the discovery above never descends into it. These tests need no
      # Ollama, Docker or corpus: the daemon is faked and socket connections are turned into errors.
      - name: use_case tc6 guard and spy tests
        if: ${{ !cancelled() }}
        run: uv run --frozen --project 01_Product_Engineering/challenge python -m unittest discover -q -s use_case/evals/tc6

      # Known vulnerabilities in what the container installs: the same export the Dockerfile
      # runs, checked against the advisory databases. pillow is excluded by name, not silenced
      # wholesale: gradio 6.26 requires pillow<13 and every listed fix is 13.0.0. Remove the
      # exclusion when gradio lifts that cap.
      - name: Dependency audit (challenge lock)
        if: ${{ !cancelled() }}
        working-directory: 01_Product_Engineering/challenge
        run: |
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --no-emit-package pillow -o "$RUNNER_TEMP/requirements.txt" -q
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes --progress-spinner off
